<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Ali Doner Mesa</title>
<meta name="theme-color" content="#17110f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ali Mesa">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192-any.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700;800&family=Noto+Naskh+Arabic:wght@400;600;700&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/mesa.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="tort" x1="0" x2="1">
      <stop offset="0" stop-color="#e2ad62"/><stop offset=".35" stop-color="#f8dca3"/><stop offset=".7" stop-color="#f0c57e"/><stop offset="1" stop-color="#c98e45"/>
    </linearGradient>
    <linearGradient id="paperg" x1="0" x2="1">
      <stop offset="0" stop-color="#e9dcc6"/><stop offset=".4" stop-color="#fffaf0"/><stop offset="1" stop-color="#d9c8ad"/>
    </linearGradient>
    <clipPath id="tclip"><path d="M44 104 Q44 86 64 84 L156 84 Q176 86 176 104 L172 400 Q110 428 48 400 Z"/></clipPath>
    <clipPath id="pclip"><path d="M38 262 L58 250 L78 264 L98 250 L118 264 L138 250 L158 264 L182 252 L178 410 Q110 446 42 410 Z"/></clipPath>
  </defs>
  <symbol id="durum" viewBox="0 0 220 460">
    <ellipse cx="110" cy="92" rx="66" ry="20" fill="#4a2414"/>
    <path d="M52 92 C44 70 66 62 70 76 C70 52 96 52 96 70 C100 46 128 50 124 70 C134 50 160 58 150 78 C170 66 178 88 166 96 Z" fill="#5fbf45"/>
    <path d="M60 86 C58 72 72 70 76 80 C80 66 98 68 96 80" fill="none" stroke="#3e9a2e" stroke-width="3" stroke-linecap="round"/>
    <rect x="74" y="58" width="44" height="16" rx="7" fill="#9a5226" transform="rotate(-18 96 66)"/>
    <rect x="104" y="52" width="40" height="15" rx="7" fill="#b8692f" transform="rotate(14 124 60)"/>
    <rect x="88" y="44" width="34" height="13" rx="6" fill="#7e3f1c" transform="rotate(-6 105 50)"/>
    <circle cx="70" cy="70" r="14" fill="#e33a2c"/><circle cx="70" cy="70" r="9" fill="#ff7a61"/><circle cx="70" cy="70" r="3" fill="#ffd1c4"/>
    <circle cx="150" cy="70" r="13" fill="#e33a2c"/><circle cx="150" cy="70" r="8" fill="#ff7a61"/>
    <path d="M118 78 a16 12 0 1 1 26 -8" fill="none" stroke="#a24fbf" stroke-width="5" stroke-linecap="round"/>
    <path d="M60 84 C76 70 86 92 100 78 S128 88 140 74 S160 86 164 80" fill="none" stroke="#fffaf0" stroke-width="6" stroke-linecap="round"/>
    <path d="M44 104 Q44 86 64 84 L156 84 Q176 86 176 104 L172 400 Q110 428 48 400 Z" fill="url(#tort)"/>
    <g clip-path="url(#tclip)" stroke="#9a5a26" stroke-width="7" stroke-linecap="round" opacity=".42">
      <path d="M20 160 L200 110"/><path d="M20 200 L200 150"/><path d="M20 240 L200 190"/>
    </g>
    <path d="M46 150 C90 170 130 200 174 252 L174 236 C134 188 92 160 46 136 Z" fill="#fbe3b2" opacity=".55"/>
    <path d="M46 150 C90 170 130 200 174 252" fill="none" stroke="#c88a45" stroke-width="3"/>
    <path d="M38 262 L58 250 L78 264 L98 250 L118 264 L138 250 L158 264 L182 252 L178 410 Q110 446 42 410 Z" fill="url(#paperg)"/>
    <g clip-path="url(#pclip)">
      <rect x="0" y="300" width="220" height="16" fill="#e5322a"/>
      <rect x="0" y="322" width="220" height="5" fill="#ffb627"/>
      <rect x="0" y="384" width="220" height="10" fill="#e5322a"/>
    </g>
    <text x="110" y="366" text-anchor="middle" font-family="Big Shoulders Display, Impact, sans-serif" font-weight="900" font-size="34" fill="#e5322a" letter-spacing="2">ALI</text>
  </symbol>

  <symbol id="box" viewBox="0 0 200 230">
    <rect x="58" y="22" width="10" height="56" rx="3" fill="#ffcf4d" transform="rotate(-14 63 50)"/>
    <rect x="80" y="10" width="10" height="64" rx="3" fill="#ffd866" transform="rotate(-4 85 42)"/>
    <rect x="110" y="16" width="10" height="60" rx="3" fill="#ffcf4d" transform="rotate(9 115 46)"/>
    <rect x="132" y="26" width="10" height="52" rx="3" fill="#ffd866" transform="rotate(18 137 52)"/>
    <path d="M44 74 C60 50 90 62 100 56 C116 48 142 58 156 74 Z" fill="#9a5226"/>
    <path d="M60 70 C76 60 96 72 110 62 C122 56 138 64 146 72" fill="none" stroke="#fffaf0" stroke-width="5" stroke-linecap="round"/>
    <path d="M28 76 L172 76 L150 218 L50 218 Z" fill="#ffb627"/>
    <path d="M28 76 L172 76 L169 96 L31 96 Z" fill="#e5322a"/>
    <path d="M42 180 L158 180 L155 196 L45 196 Z" fill="#e5322a"/>
    <text x="100" y="152" text-anchor="middle" font-family="Big Shoulders Display, Impact, sans-serif" font-weight="900" font-size="30" fill="#1a120e" letter-spacing="1">DÖNER</text>
  </symbol>

  <symbol id="tomato" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#e33a2c"/><circle cx="50" cy="50" r="36" fill="#ff6b52"/><g fill="#ffd9c9"><ellipse cx="50" cy="30" rx="6" ry="9"/><ellipse cx="68" cy="58" rx="6" ry="9" transform="rotate(120 68 58)"/><ellipse cx="32" cy="58" rx="6" ry="9" transform="rotate(-120 32 58)"/></g><circle cx="50" cy="50" r="7" fill="#ffa48f"/></symbol>
  <symbol id="onion" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#b55fcf" stroke-width="10"/><circle cx="50" cy="50" r="26" fill="none" stroke="#e1b7ec" stroke-width="7"/></symbol>
  <symbol id="leaf" viewBox="0 0 100 100"><path d="M10 80 C10 30 50 6 92 10 C94 52 66 92 14 88 Z" fill="#5fbf45"/><path d="M14 86 C40 60 60 40 88 14" fill="none" stroke="#3e9a2e" stroke-width="5" stroke-linecap="round"/></symbol>
  <symbol id="chili" viewBox="0 0 100 100"><path d="M24 26 C50 30 80 50 84 90 C60 72 30 60 16 36 Z" fill="#e33a2c"/><path d="M20 30 C14 20 18 10 30 8" fill="none" stroke="#3e9a2e" stroke-width="7" stroke-linecap="round"/></symbol>
  <symbol id="cup" viewBox="0 0 100 100"><path d="M28 30 L72 30 L66 92 L34 92 Z" fill="#e5322a"/><rect x="24" y="22" width="52" height="10" rx="4" fill="#fff3e2"/><path d="M54 22 L62 4" stroke="#fff3e2" stroke-width="5" stroke-linecap="round"/><path d="M36 52 C46 46 56 58 66 52" fill="none" stroke="#fff3e2" stroke-width="4" stroke-linecap="round"/></symbol>

  <symbol id="halal" viewBox="0 0 200 200">
    <path id="sealring" d="M100 100 m-74 0 a74 74 0 1 1 148 0 a74 74 0 1 1 -148 0" fill="none"/>
    <circle cx="100" cy="100" r="98" fill="#1e9e5c"/>
    <circle cx="100" cy="100" r="90" fill="none" stroke="#fff3e2" stroke-width="2" stroke-dasharray="3 5"/>
    <g class="spin">
      <text font-family="Figtree, sans-serif" font-weight="800" font-size="15" letter-spacing="4.4" fill="#fff3e2"><textPath href="#sealring">CERTIFIED HALAL FOOD · 100% HALAL ·</textPath></text>
    </g>
    <circle cx="100" cy="100" r="58" fill="#fff3e2"/>
    <text x="100" y="106" text-anchor="middle" font-family="Reem Kufi, Noto Naskh Arabic, Geeza Pro, serif" font-weight="700" font-size="40" fill="#1e9e5c">حلال</text>
    <text x="100" y="134" text-anchor="middle" font-family="Figtree, sans-serif" font-weight="800" font-size="14" letter-spacing="3" fill="#1e9e5c">HALAL</text>
  </symbol>
</svg>

<div class="app" id="app">
  <header class="bar">
    <div class="logo"><span class="mk">ALI</span><span><b>Ali Doner</b><small data-t="halal">100% halal</small></span></div>
    <span class="demo-chip" id="demo-chip" hidden>DEMO</span>
    <button class="pill" id="btn-waiter" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 15a6 6 0 0 1 12 0"/><path d="M4 18h16"/><path d="M12 9V7"/><circle cx="12" cy="5.5" r="1.2"/></svg><span class="t" data-t="callWaiter">Llamar al camarero</span></button>
    <button class="pill" id="btn-bill" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span class="t" data-t="askBill">Pedir la cuenta</span></button>
    <button class="pill lang" id="btn-lang" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span id="lang-label">ES</span></button>
    <button class="tbl" id="btn-table" type="button"><small data-t="table">Mesa</small><b id="table-num">1</b></button>
  </header>

  <div class="main">
    <nav class="rail" id="rail" aria-label="Categorías"></nav>
    <div class="list" id="list"></div>
    <aside class="ticket" id="ticket">
      <div class="t-head"><h2 data-t="yourOrder">Tu pedido</h2><button class="pill" id="close-sheet" type="button" hidden>✕</button></div>
      <div class="t-body" id="t-body"></div>
      <div class="t-foot">
        <div class="t-tot"><span data-t="total">Total</span><b id="t-total">0,00 €</b></div>
        <button class="big" id="btn-send" type="button" data-t="send" disabled>Enviar a cocina</button>
      </div>
    </aside>
  </div>
  <button class="sheet-btn" id="sheet-btn" type="button" hidden><span><span data-t="viewOrder">Ver pedido</span> · <span id="sheet-count">0</span></span><b id="sheet-total">0,00 €</b></button>
</div>

<div class="welcome" id="welcome">
  <div class="w-table" id="w-table">Mesa 1</div>
  <div class="w-copy">
    <div class="hello" id="hello"><span>Bienvenido</span></div>
    <p id="w-sub">Pide desde la mesa. Te lo traemos recién hecho.</p>
    <div class="lbl" id="w-choose">Elige tu idioma</div>
    <div class="langs" id="w-langs"></div>
  </div>
  <div class="w-art"><img src="img/base.webp" alt=""><svg viewBox="0 0 200 200" aria-hidden="true"><use href="#halal"/></svg></div>
</div>

<div class="layer" id="layer" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/menu-data.js"></script>
<script src="js/mesa.js"></script>
</body>
</html>
